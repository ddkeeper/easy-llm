name: nanogpt
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # 训练/推理核心
  - pytorch=2.5
  - pytorch-cuda=12.1   # CUDA 版 PyTorch；纯 CPU 机器可删掉这一行
  - torchvision
  - numpy
  # BPE 分词器用的正则（支持 \p{L} 等 Unicode 属性，Python 内置 re 不支持）
  - regex
  - einops
  # 实验日志
  - wandb
  # 运行 notebook
  - jupyter
  - ipykernel
  - pip:
      - tiktoken   # 仅作 GPT-2 预分词正则的参考来源，项目本身不 import
